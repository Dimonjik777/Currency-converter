<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency converter</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="container">
    <div class="container__content">
      <h1>CURRENCY CONVERTER</h1>
      <div class="amout__block">
        <h2>Amout:</h2>
        <input type="number" class="amout" placeholder="100">
      </div>
      <div class="currency">
        <div class="currency__left">
          <h2>From:</h2>
          <select class="currency__from">
            <option value="USD">USD</option>
            <option value="EURO">EURO</option>
          </select>
        </div>
        <div class="currency__right">
          <h2>To:</h2>
          <select class="currency__to">
            <option value="USD">USD</option>
            <option value="EURO">EURO</option>
          </select>
        </div>
      </div>
      <button>Convert</button>
      <div class="result">100 USD = 105 EURO</div>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
